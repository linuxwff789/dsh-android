name: Build rootfs

# Builds the preconfigured rootfs (debian arm64 + node + dsh) on an x86_64
# GitHub Actions runner via debootstrap + qemu-aarch64-static. The produced
# artifact is the same tar.xz that the phone-side scripts/build-rootfs.sh
# produces natively (both run scripts/setup-container.sh inside the rootfs).
#
# Usage: push to main, or workflow_dispatch. Artifact: dsh-rootfs.tar.xz

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "patches/**", ".github/workflows/build-rootfs.yml"]

jobs:
  rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install qemu + debootstrap tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static binfmt-support debootstrap xz-utils

      - name: Debootstrap debian trixie (arm64)
        run: |
          sudo debootstrap --arch=arm64 --foreign trixie rootfs http://deb.debian.org/debian
          sudo cp /usr/bin/qemu-aarch64-static rootfs/usr/bin/
          sudo chroot rootfs /debootstrap/debootstrap --second-stage

      - name: Copy pipeline into rootfs
        run: |
          sudo mkdir -p rootfs/opt/pipeline
          sudo cp -a scripts patches rootfs/opt/pipeline/

      - name: Run in-container setup (qemu-aarch64 emulated)
        run: |
          sudo chroot rootfs /bin/bash /opt/pipeline/setup-container.sh /opt/pipeline/patches

      - name: Clean pipeline + apt residue
        run: |
          sudo rm -rf rootfs/opt/pipeline
          sudo rm -rf rootfs/var/lib/apt/lists rootfs/var/cache/apt

      - name: Package rootfs
        run: |
          sudo tar -C rootfs -cJf dsh-rootfs.tar.xz .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: dsh-rootfs
          path: dsh-rootfs.tar.xz
          retention-days: 14