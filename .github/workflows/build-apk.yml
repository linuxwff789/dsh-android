name: Build APK

# Builds the DSH for Android APK (termux-app fork + dsh overlay).
#
# Triggers:
#   - automatically after the "Build rootfs" workflow succeeds (it supplies
#     the rootfs.tar.xz artifact that gets bundled into the APK assets)
#   - manually via workflow_dispatch (rootfs_url input overrides the artifact)
#
# Small runtime assets (proot/xz/libs) come from the repo; the rootfs archive
# is downloaded from the triggering rootfs build artifact.
on:
  workflow_run:
    workflows: [Build rootfs]
    types: [completed]
  workflow_dispatch:
    inputs:
      rootfs_url:
        description: "URL of dsh-rootfs.tar.xz (artifact download URL or release asset)"
        required: false

jobs:
  apk:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APKs
        shell: bash {0}
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_APP_VERSION_NAME: 0.118.0+dsh
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: "0"
        run: |
          ls -la app/src/main/assets/opt/dsh/
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: dsh-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14