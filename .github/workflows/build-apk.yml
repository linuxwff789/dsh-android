name: Build APK

# Builds the DSH for Android APK (termux-app fork + dsh overlay).
#
# No emulator/prebuilt rootfs step: the APK ships only the small bundled
# base rootfs (assets/opt/dsh/base.tar.xz) + install-dsh.sh, and the
# container bootstraps node + deepseek-harness ONLINE on first launch
# (Tsinghua apt + npmmirror node/npm). Small runtime assets (proot/xz/libs)
# are committed to the repo.
#
# Trigger: manual workflow_dispatch, or push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "scripts/**", "patches/**", ".github/workflows/build-apk.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create/delete the dsh-nightly release
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APKs
        shell: bash {0}
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_APP_VERSION_NAME: 0.118.0+dsh
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: "0"
          TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: "0"
        run: |
          ls -la app/src/main/assets/opt/dsh/
          ./gradlew assembleRelease --no-daemon

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="dsh-nightly"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          # a stable release tag so users always have one fixed download link
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$APK" \
            --title "DSH nightly (${{ github.sha }}) v0.118.0+dsh" \
            --notes "Fixed-signature build. Stable download: https://github.com/linuxwff789/dsh-android/releases/latest"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: dsh-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
