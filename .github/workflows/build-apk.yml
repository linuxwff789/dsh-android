name: Build APK

# Builds the DSH for Android APK (termux-app fork + dsh overlay).
#
# Triggers:
#   - automatically after the "Build rootfs" workflow succeeds (it supplies
#     the rootfs.tar.xz artifact that gets bundled into the APK assets)
#   - manually via workflow_dispatch (rootfs_url input overrides the artifact)
#
# Small runtime assets (proot/xz/libs) come from the repo; the rootfs archive
# is downloaded from the triggering rootfs build artifact.
on:
  workflow_run:
    workflows: [Build rootfs]
    types: [completed]
  workflow_dispatch:
    inputs:
      rootfs_url:
        description: "URL of dsh-rootfs.tar.xz (artifact download URL or release asset)"
        required: false

jobs:
  apk:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download rootfs asset
        shell: bash
        run: |
          set -euo pipefail
          URL='${{ github.event.inputs.rootfs_url }}'
          if [ -z "$URL" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
            [ -n "$RUN_ID" ] || RUN_ID="$(gh api repos/${{ github.repository }}/actions/workflows/build-rootfs.yml/runs \
                --jq '.workflow_runs[] | select(.conclusion=="success") | .id' | head -1)"
            ART_ID="$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts \
                --jq '.artifacts[0].id')"
            URL="https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip"
            echo "using rootfs artifact $ART_ID from run $RUN_ID"
          fi
          mkdir -p app/src/main/assets/opt/dsh
          if [[ "$URL" == *.zip || "$URL" == */zip ]]; then
            curl -fsSL -H "Authorization: Bearer ${{ github.token }}" "$URL" -o rootfs.zip
            unzip -o rootfs.zip -d rootfs-pkg
            cp rootfs-pkg/*.tar.xz app/src/main/assets/opt/dsh/rootfs.tar.xz
          else
            curl -fsSL "$URL" -o app/src/main/assets/opt/dsh/rootfs.tar.xz
          fi
          ls -la app/src/main/assets/opt/dsh/

      - name: Build APKs
        shell: bash {0}
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_APP_VERSION_NAME: 0.118.0+dsh
        run: |
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: dsh-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14