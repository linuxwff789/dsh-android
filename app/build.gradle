plugins {
    id "com.android.application"
}

ext {
    // The packageVariant defines the bootstrap variant that will be included in the app APK.
    // This must be supported by com.termux.shared.termux.TermuxBootstrap.PackageVariant or app will
    // crash at startup.
    // Bootstrap of a different variant must not be manually installed by the user after app installation
    // by replacing $PREFIX since app code is dependant on the variant used to build the APK.
    // Currently supported values are: [ "apt-android-7" "apt-android-5" ]
    packageVariant = System.getenv("TERMUX_PACKAGE_VARIANT") ?: "apt-android-7" // Default: "apt-android-7"
}

android {
    namespace "com.termux"

    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion
    def appVersionName = System.getenv("TERMUX_APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_APK_VERSION_TAG") ?: ""
    def splitAPKsForDebugBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS") ?: "1"
    def splitAPKsForReleaseBuilds = System.getenv("TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS") ?: "0" // F-Droid does not support split APKs #1904

    dependencies {
        implementation "androidx.annotation:annotation:1.9.0"
        implementation "androidx.core:core:1.13.1"
        implementation "androidx.drawerlayout:drawerlayout:1.2.0"
        implementation "androidx.preference:preference:1.2.1"
        implementation "androidx.viewpager:viewpager:1.0.0"
        implementation "com.google.android.material:material:1.12.0"
        implementation "com.google.guava:guava:24.1-jre"
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"
        implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'

        implementation project(":terminal-view")
        implementation project(":termux-shared")
    }

    defaultConfig {
        applicationId "dev.lwff.dsh"
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        versionCode 118
        versionName "0.118.0"

        if (appVersionName) versionName = appVersionName
        validateVersionName(versionName)

        buildConfigField "String", "TERMUX_PACKAGE_VARIANT", "\"" + project.ext.packageVariant + "\"" // Used by TermuxApplication class

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "dev.lwff.dsh"
        manifestPlaceholders.TERMUX_APP_NAME = "DSH"
        manifestPlaceholders.TERMUX_API_APP_NAME = "Termux:API"
        manifestPlaceholders.TERMUX_BOOT_APP_NAME = "Termux:Boot"
        manifestPlaceholders.TERMUX_FLOAT_APP_NAME = "Termux:Float"
        manifestPlaceholders.TERMUX_STYLING_APP_NAME = "Termux:Styling"
        manifestPlaceholders.TERMUX_TASKER_APP_NAME = "Termux:Tasker"
        manifestPlaceholders.TERMUX_WIDGET_APP_NAME = "Termux:Widget"

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
            }
        }

        splits {
            abi {
                enable ((gradle.startParameter.taskNames.any { it.contains("Debug") } && splitAPKsForDebugBuilds == "1") ||
                    (gradle.startParameter.taskNames.any { it.contains("Release") } && splitAPKsForReleaseBuilds == "1"))
                reset ()
                include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
                universalApk true
            }
        }
    }

    signingConfigs {
        // Fixed release signing: the keystore is committed (keystore/dsh-release.p12)
        // so every APK built (locally OR on CI) carries the same stable signature
        // and can update-pav over previously installed builds. Passwords default to
        // the committed dev values but can be overridden via env/CI secrets without
        // changing the key itself.
        def keystoreFile = file(System.getenv("DSH_KEYSTORE_FILE") ?: '../keystore/dsh-release.p12')
        release {
            storeFile keystoreFile
            storeType 'PKCS12'
            keyAlias System.getenv("DSH_KEY_ALIAS") ?: 'dsh'
            storePassword System.getenv("DSH_STORE_PASSWORD") ?: 'dshdsh'
            keyPassword System.getenv("DSH_KEY_PASSWORD") ?: 'dshdsh'
        }
        debug {
            storeFile file('../keystore/dsh-release.p12')
            storeType 'PKCS12'
            keyAlias 'dsh'
            storePassword 'dshdsh'
            keyPassword 'dshdsh'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false // Reproducible builds
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }

    lint {
        disable 'ProtectedPermissions'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "debug") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("termux-app_" + (apkVersionTag ? apkVersionTag : project.ext.packageVariant + "-" + "debug") + "_" + (abi ? abi : "universal") + ".apk")
            } else if (variant.buildType.name == "release") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("termux-app_" + (apkVersionTag ? apkVersionTag : project.ext.packageVariant + "-" + "release") + "_" + (abi ? abi : "universal") + ".apk")
            }
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.10"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '"  + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}

def downloadBootstrap(String arch, String expectedChecksum, String version) {
    def digest = java.security.MessageDigest.getInstance("SHA-256")

    def localUrl = "src/main/cpp/bootstrap-" + arch + ".zip"
    def file = new File(projectDir, localUrl)
    def fileIsUpToDate = false
    if (file.exists()) {
        def buffer = new byte[8192]
        def input = new FileInputStream(file)
        while (true) {
            def readBytes = input.read(buffer)
            if (readBytes < 0) break
            digest.update(buffer, 0, readBytes)
        }
        def checksum = new BigInteger(1, digest.digest()).toString(16)
        while (checksum.length() < 64) { checksum = "0" + checksum }
        if (checksum == expectedChecksum) {
            fileIsUpToDate = true
        } else {
            logger.quiet("Deleting old local file with wrong hash: " + localUrl + ": expected: " + expectedChecksum + ", actual: " + checksum)
            file.delete()
        }
    }

    if (!fileIsUpToDate) {
        def remoteUrl = "https://github.com/termux/termux-packages/releases/download/bootstrap-" + version + "/bootstrap-" + arch + ".zip"
        logger.quiet("Downloading " + remoteUrl + " ...")

        file.parentFile.mkdirs()
        def out = new BufferedOutputStream(new FileOutputStream(file))

        def connection = new URL(remoteUrl).openConnection()
        connection.setInstanceFollowRedirects(true)
        def digestStream = new java.security.DigestInputStream(connection.inputStream, digest)
        out << digestStream
        out.close()

        def checksum = new BigInteger(1, digest.digest()).toString(16)
        while (checksum.length() < 64) { checksum = "0" + checksum }
        if (checksum != expectedChecksum) {
            file.delete()
            throw new GradleException("Wrong checksum for " + remoteUrl + ": expected: " + expectedChecksum + ", actual: " + checksum)
        }
    }

    patchBootstrapZip(arch)
}

/**
 * Replace the stock bootstrap's baked-in "/data/data/com.termux" paths with
 * this fork's applicationId (dev.lwff.dsh). The official termux-packages
 * bootstrap archive hardcodes the original package path in script shebangs
 * (bin/login, bin/* wrappers), SYMLINKS.txt symlink targets, *.pc files, etc.
 * Without this the embedded app fails with:
 *   exec("/data/data/<pkg>/files/usr/bin/login"): Permission denied
 * because the shebang interpreter resolves to another app's private
 * directory (u0_a303, mode 0700) which this app cannot execute.
 * Only text files (no NUL bytes) are rewritten; ELF binaries are left
 * untouched. Idempotent: a patched archive contains no "com.termux".
 * Runs after download and BEFORE the ndk-build .incbin embeds the archive.
 */
def patchBootstrapZip(String arch) {
    def zipFile = new File(projectDir, "src/main/cpp/bootstrap-" + arch + ".zip")
    def pkgName = android.defaultConfig.applicationId
    if (!zipFile.exists() || pkgName == null || "com.termux".equals(pkgName)) return

    def patchedZip = new File(projectDir, "build/bootstrap-patched-" + arch + ".zip")
    patchedZip.parentFile.mkdirs()

    def patchedCount = 0
    def zin = new java.util.zip.ZipInputStream(new BufferedInputStream(new FileInputStream(zipFile)))
    def zout = new java.util.zip.ZipOutputStream(new BufferedOutputStream(new FileOutputStream(patchedZip)))
    // dpkg has NO env override for its config dir (no DPKG_CONFIG_DIR in
    // dpkg 1.22); the path is compiled in as "/data/data/com.termux/
    // files/usr/etc/dpkg" + "/dpkg.cfg.d". Patch it in EVERY entry with a
    // SAME-LENGTH fork path whose last component is a symlink we add to
    // SYMLINKS.txt: .../usr/etc/d (-> dpkg). Same length keeps ELF string
    // table offsets valid, so this is safe on binaries too.
    def dpkgCfgOld = "/data/data/com.termux/files/usr/etc/dpkg".getBytes("UTF-8")
    def dpkgCfgNew = ("/data/data/" + pkgName + "/files/usr/etc/d/").getBytes("UTF-8")
    if (dpkgCfgOld.length != dpkgCfgNew.length)
        throw new GradleException("dpkg config-dir swap must be same-length")
    def swapCount = 0
    try {
        java.util.zip.ZipEntry entry
        byte[] buffer = new byte[65536]
        while ((entry = zin.getNextEntry()) != null) {
            def newEntry = new java.util.zip.ZipEntry(entry.name)
            newEntry.time = entry.time
            zout.putNextEntry(newEntry)
            if (!entry.isDirectory()) {
                def bos = new java.io.ByteArrayOutputStream()
                int n
                while ((n = zin.read(buffer)) != -1) bos.write(buffer, 0, n)
                def bytes = bos.toByteArray()
                // Same-length dpkg config-dir swap (text AND binary files).
                for (int i = 0; i + dpkgCfgOld.length <= bytes.length; i++) {
                    boolean match = true
                    for (int j = 0; j < dpkgCfgOld.length; j++) {
                        if (bytes[i + j] != dpkgCfgOld[j]) { match = false; break }
                    }
                    if (match) {
                        for (int j = 0; j < dpkgCfgNew.length; j++) bytes[i + j] = dpkgCfgNew[j]
                        swapCount++
                    }
                }
                def text = new String(bytes, "UTF-8")
                if (!text.contains("\u0000") && text.contains("com.termux")) {
                    bytes = text.replace("com.termux", pkgName).getBytes("UTF-8")
                    patchedCount++
                }
                zout.write(bytes)
            }
            zout.closeEntry()
        }
    } finally {
        zout.close()
        zin.close()
    }
    // Bake fork-specific config into the archive so even the very FIRST
    // pkg/apt invocation works without the setup script. Paths are
    // generated with the fork package name directly (these entries are
    // added after the text pass, so com.termux would not be rewritten).
    def P = "/data/data/" + pkgName + "/files/usr"
    def fixScript =
            "#!/bin/sh\n" +
            "# Rewrite com.termux shebangs in installed scripts to this fork's prefix.\n" +
            "# Installed via DPkg::Post-Invoke so every package apt installs is covered.\n" +
            "for d in \"${P}/bin\" \"${P}/libexec\"; do\n" +
            "  for f in \"\$d\"/*; do\n" +
            "    [ -f \"\$f\" ] || continue\n" +
            "    case \"\$(head -c 100 \"\$f\" | head -1)\" in\n" +
            "      '#!'*com.termux*)\n" +
            "        sed -i '1s#com.termux#${pkgName}#' \"\$f\" 2>/dev/null || true\n" +
            "        ;;\n" +
            "    esac\n" +
            "  done\n" +
            "done\n" +
            "exit 0\n"
    def extra = [
        "etc/apt/apt.conf.d/00-dsh-cainfo":
            "Acquire::https::CAInfo \"${P}/etc/tls/cert.pem\";\n",
        "bin/dsh-fix-scripts.sh": fixScript,
        "etc/apt/dsh-apt.conf":
            "Dir::Etc \"${P}/etc/apt\";\n" +
            "Dir::Etc::main \"${P}/etc/apt/sources.list\";\n" +
            "Dir::Etc::parts \"${P}/etc/apt/apt.conf.d\";\n" +
            "Dir::Etc::sourceparts \"${P}/etc/apt/sources.list.d\";\n" +
            "Dir::Etc::trustedparts \"${P}/etc/apt/trusted.gpg.d\";\n" +
            "Dir::Etc::preferencesparts \"${P}/etc/apt/preferences.d\";\n" +
            "Dir::State \"${P}/var/lib/apt\";\n" +
            "Dir::State::status \"${P}/var/lib/dpkg/status\";\n" +
            "Dir::Cache \"${P}/var/cache/apt\";\n" +
            "Dir::Cache::archives \"${P}/var/cache/apt/archives\";\n" +
            "Dir::Cache::pkgcache \"${P}/var/cache/apt/pkgcache.bin\";\n" +
            "Dir::Cache::srcpkgcache \"${P}/var/cache/apt/srcpkgcache.bin\";\n" +
            "Dir::Bin::methods \"${P}/lib/apt/methods\";\n" +
            "Dir::Bin::dpkg \"${P}/bin/dpkg\";\n" +
            "Dir::Bin::dpkg-deb \"${P}/bin/dpkg-deb\";\n" +
            "Dir::Bin::gpgv \"${P}/bin/gpgv\";\n" +
            "Dir::Log \"${P}/var/log/apt\";\n" +
            "DPkg::PATH \"${P}/bin:/system/bin\";\n" +
            "DPkg::Post-Invoke {\"${P}/bin/dsh-fix-scripts.sh\";};\n"
    ]
    def symlinksRewritten = false
    def zin2 = new java.util.zip.ZipInputStream(new BufferedInputStream(new FileInputStream(patchedZip)))
    def zout2 = new java.util.zip.ZipOutputStream(new BufferedOutputStream(new FileOutputStream(zipFile)))
    try {
        java.util.zip.ZipEntry entry2
        byte[] buffer2 = new byte[65536]
        while ((entry2 = zin2.getNextEntry()) != null) {
            def newEntry = new java.util.zip.ZipEntry(entry2.name)
            newEntry.time = entry2.time
            zout2.putNextEntry(newEntry)
            if (!entry2.isDirectory()) {
                def bos2 = new java.io.ByteArrayOutputStream()
                int n2
                while ((n2 = zin2.read(buffer2)) != -1) bos2.write(buffer2, 0, n2)
                def bytes2 = bos2.toByteArray()
                if (entry2.name == "SYMLINKS.txt") {
                    def text2 = new String(bytes2, "UTF-8")
                    text2 += "${P}/etc/termux/mirrors/chinese_mainland/mirrors.tuna.tsinghua.edu.cn\u2190./etc/termux/chosen_mirrors\n"
                    // etc/d is the same-length alias for dpkg's compiled-in
                    // config dir (see the dpkgCfg swap in pass 1).
                    text2 += "${P}/etc/dpkg\u2190./etc/d\n"
                    bytes2 = text2.getBytes("UTF-8")
                    symlinksRewritten = true
                }
                zout2.write(bytes2)
            }
            zout2.closeEntry()
        }
        if (!symlinksRewritten) throw new GradleException("SYMLINKS.txt not found in " + zipFile.name)
        extra.each { name, content ->
            def ze = new java.util.zip.ZipEntry(name)
            ze.time = System.currentTimeMillis()
            zout2.putNextEntry(ze)
            zout2.write(content.getBytes("UTF-8"))
            zout2.closeEntry()
        }
    } finally {
        zout2.close()
        zin2.close()
    }
    logger.quiet("Patched " + zipFile.name + ": " + patchedCount + " files (com.termux -> " + pkgName + "), " + swapCount + " dpkg-cfg swaps" + (symlinksRewritten ? " + symlinks" : ""))
    patchedZip.delete()
}

clean {
    doLast {
        def tree = fileTree(new File(projectDir, 'src/main/cpp'))
        tree.include 'bootstrap-*.zip'
        tree.each { it.delete() }
    }
}

task downloadBootstraps() {
    doLast {
        def packageVariant = project.ext.packageVariant
        if (packageVariant == "apt-android-7") {
            def version = "2026.02.12-r1" + "%2B" + "apt.android-7"
            downloadBootstrap("aarch64", "ea2aeba8819e517db711f8c32369e89e7c52cee73e07930ff91185e1ab93f4f3", version)
            downloadBootstrap("arm", "a38f4d3b2f735f83be2bf54eff463e86dc32a3e2f9f861c1557c4378d249c018", version)
            downloadBootstrap("i686", "f5bc0b025b9f3b420b5fcaeefc064f888f5f22a0d6fd7090f4aac0c33eb3555b", version)
            downloadBootstrap("x86_64", "b7fd0f2e3a4de534be3144f9f91acc768630fc463eaf134ab2e64c545e834f7a", version)
        } else if (packageVariant == "apt-android-5") {
            def version = "2022.04.28-r6" + "+" + packageVariant
            downloadBootstrap("aarch64", "913609d439415c828c5640be1b0561467e539cb1c7080662decaaca2fb4820e7", version)
            downloadBootstrap("arm", "26bfb45304c946170db69108e5eb6e3641aad751406ce106c80df80cad2eccf8", version)
            downloadBootstrap("i686", "46dcfeb5eef67ba765498db9fe4c50dc4690805139aa0dd141a9d8ee0693cd27", version)
            downloadBootstrap("x86_64", "615b590679ee6cd885b7fd2ff9473c845e920f9b422f790bb158c63fe42b8481", version)
        } else {
            throw new GradleException("Unsupported TERMUX_PACKAGE_VARIANT \"" + packageVariant + "\"")
        }
    }
}

afterEvaluate {
    // Ensure bootstrap-*.zip is downloaded before the native termux-bootstrap
    // target compiles (termux-bootstrap-zip.S .incbin's them). In release the
    // ndk-build task may be scheduled BEFORE javaCompile, so we must wire the
    // download as a dependency of the native build too, not just javaCompile.
    tasks.matching { it.name.startsWith("buildNdkBuild") }.configureEach {
        dependsOn downloadBootstraps
    }
    android.applicationVariants.all { variant ->
        variant.javaCompileProvider.get().dependsOn(downloadBootstraps)
    }
}
